<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}AgriLink{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container"><a class="navbar-brand fw-bold text-success" href="{{ url_for('home') }}">AgriLink</a>
      <span class="navbar-text">Connecting growers and buyers</span></div>
  </nav>
  <main class="container py-5">{% block content %}{% endblock %}</main>
  <footer class="border-top py-4"><div class="container text-muted small">AgriLink agricultural marketplace</div></footer>
</body>
</html>
